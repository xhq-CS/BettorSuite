<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>BettorStats</title>
    <meta name="description" content="BettorStats — Sports betting insights, player trends, and bet tracking." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="BettorStats" />
    <meta property="og:description" content="Sports betting insights, player trends, and bet tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BettorStats" />
    <meta name="twitter:description" content="Sports betting insights, player trends, and bet tracking." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme before React renders to avoid flash
      (function() {
        try {
          var t = localStorage.getItem('bs-theme') || 'dark';
          document.documentElement.classList.add(t);
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
