openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BettorStats API - sportsbook tracker and community
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bets
    description: Real bet tracking
  - name: simulator
    description: Virtual bet simulator
  - name: community
    description: Community posts and social
  - name: users
    description: User profiles and social graph
  - name: messages
    description: Direct messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Book Keeper ─────────────────────────────────────────────────────────
  /bets:
    get:
      operationId: listBets
      tags: [bets]
      summary: List bets for the current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, won, lost, push, void]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bet"
    post:
      operationId: createBet
      tags: [bets]
      summary: Log a new bet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"

  /bets/summary:
    get:
      operationId: getBetSummary
      tags: [bets]
      summary: Win rate, ROI, and profit/loss summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetSummary"

  /bets/{id}:
    patch:
      operationId: updateBet
      tags: [bets]
      summary: Update a bet (settle result)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
    delete:
      operationId: deleteBet
      tags: [bets]
      summary: Delete a bet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Simulator ────────────────────────────────────────────────────────────
  /simulator/wallet:
    get:
      operationId: getSimulatorWallet
      tags: [simulator]
      summary: Get virtual wallet balance and stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorWallet"
    post:
      operationId: resetSimulatorWallet
      tags: [simulator]
      summary: Reset wallet to a fresh balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletReset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorWallet"

  /simulator/bets:
    get:
      operationId: listSimulatorBets
      tags: [simulator]
      summary: List virtual bets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulatorBet"
    post:
      operationId: createSimulatorBet
      tags: [simulator]
      summary: Place a virtual bet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatorBetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorBet"

  /simulator/bets/{id}:
    patch:
      operationId: settleSimulatorBet
      tags: [simulator]
      summary: Settle a virtual bet (win/loss)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatorBetSettle"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorBet"

  # ── Community ────────────────────────────────────────────────────────────
  /posts:
    get:
      operationId: listPosts
      tags: [community]
      summary: Get community feed
      parameters:
        - name: cursor
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostFeed"
    post:
      operationId: createPost
      tags: [community]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [community]
      summary: Get a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [community]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /posts/{id}/like:
    post:
      operationId: likePost
      tags: [community]
      summary: Like or unlike a post
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  # ── Users ────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Search users
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: OK

  /users/{id}/followers:
    get:
      operationId: getUserFollowers
      tags: [users]
      summary: Get a user's followers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /users/{id}/following:
    get:
      operationId: getUserFollowing
      tags: [users]
      summary: Get users this user follows
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  # ── Messages ─────────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List DM conversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [messages]
      summary: Start a new DM conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Leaderboard ──────────────────────────────────────────────────────────
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [community]
      summary: Top bettors by win rate and profit
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Bets ─────────────────────────────────────────────────────────────
    Bet:
      type: object
      required: [id, userId, description, betType, wager, odds, status, createdAt]
      properties:
        id:           { type: integer }
        userId:       { type: integer }
        description:  { type: string }
        betType:      { type: string }
        sportsbook:   { type: ["string", "null"] }
        wager:        { type: number }
        odds:         { type: number }
        parlayLegs:   { type: array, items: { $ref: "#/components/schemas/ParlayLeg" } }
        profitBoostPercent: { type: number }
        potentialPayout: { type: number }
        actualPayout: { type: ["number", "null"] }
        status:       { type: string, enum: [pending, won, lost, push, void] }
        sport:        { type: ["string", "null"] }
        playerName:   { type: ["string", "null"] }
        notes:        { type: ["string", "null"] }
        createdAt:    { type: string }
        settledAt:    { type: ["string", "null"] }

    BetInput:
      type: object
      required: [description, betType, wager, odds]
      properties:
        description:  { type: string }
        betType:      { type: string }
        sportsbook:   { type: string }
        wager:        { type: number }
        odds:         { type: number }
        parlayLegs:   { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/ParlayLeg" } }
        profitBoostPercent: { type: number, minimum: 0, maximum: 1000 }
        sport:        { type: string }
        playerName:   { type: string }
        notes:        { type: string }

    BetUpdate:
      type: object
      properties:
        status:       { type: string, enum: [pending, won, lost, push, void] }
        actualPayout: { type: number }
        profitBoostPercent: { type: number, minimum: 0, maximum: 1000 }
        parlayLegs:   { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/ParlayLeg" } }
        notes:        { type: string }

    ParlayLeg:
      type: object
      required: [description, odds, sport, betType]
      properties:
        description: { type: string, minLength: 1, maxLength: 160 }
        odds:        { type: number }
        sport:       { type: string }
        betType:     { type: string }

    BetSummary:
      type: object
      required: [totalBets, wins, losses, pushes, winRate, totalWagered, totalProfit, roi]
      properties:
        totalBets:    { type: integer }
        wins:         { type: integer }
        losses:       { type: integer }
        pushes:       { type: integer }
        winRate:      { type: number }
        totalWagered: { type: number }
        totalProfit:  { type: number }
        roi:          { type: number }

    # ── Simulator ────────────────────────────────────────────────────────
    SimulatorWallet:
      type: object
      required: [id, userId, balance, startingBalance, unitMode, unitSize, customUnitSize, totalBets, wins, losses, totalProfit]
      properties:
        id:              { type: integer }
        userId:          { type: integer }
        balance:         { type: number }
        startingBalance: { type: number }
        unitMode:        { type: string, enum: [auto, custom] }
        unitSize:        { type: number }
        customUnitSize:  { type: number }
        totalBets:       { type: integer }
        wins:            { type: integer }
        losses:          { type: integer }
        totalProfit:     { type: number }
        winRate:         { type: number }

    WalletReset:
      type: object
      required: [startingBalance]
      properties:
        startingBalance: { type: number }

    SimulatorBet:
      type: object
      required: [id, userId, description, betType, wager, odds, potentialPayout, status, createdAt]
      properties:
        id:              { type: integer }
        userId:          { type: integer }
        description:     { type: string }
        betType:         { type: string }
        wager:           { type: number }
        odds:            { type: number }
        parlayLegs:      { type: array, items: { $ref: "#/components/schemas/ParlayLeg" } }
        profitBoostPercent: { type: number }
        potentialPayout: { type: number }
        actualPayout:    { type: ["number", "null"] }
        status:          { type: string, enum: [pending, won, lost, push] }
        sport:           { type: ["string", "null"] }
        playerName:      { type: ["string", "null"] }
        createdAt:       { type: string }

    SimulatorBetInput:
      type: object
      required: [description, betType, wager, odds]
      properties:
        description: { type: string }
        betType:     { type: string }
        wager:       { type: number }
        odds:        { type: number }
        parlayLegs:  { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/ParlayLeg" } }
        profitBoostPercent: { type: number, minimum: 0, maximum: 1000 }
        sport:       { type: string }
        playerName:  { type: string }

    SimulatorBetSettle:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [won, lost, push] }

    # ── Community ────────────────────────────────────────────────────────
    Post:
      type: object
      required: [id, userId, username, content, likeCount, liked, createdAt]
      properties:
        id:          { type: integer }
        userId:      { type: integer }
        username:    { type: string }
        avatarUrl:   { type: ["string", "null"] }
        content:     { type: string }
        likeCount:   { type: integer }
        liked:       { type: boolean }
        sport:       { type: ["string", "null"] }
        playerTag:   { type: ["string", "null"] }
        createdAt:   { type: string }

    PostFeed:
      type: object
      required: [posts, hasMore]
      properties:
        posts:   { type: array, items: { $ref: "#/components/schemas/Post" } }
        hasMore: { type: boolean }
        nextCursor: { type: ["integer", "null"] }

    PostInput:
      type: object
      required: [content]
      properties:
        content:   { type: string }
        sport:     { type: string }
        playerTag: { type: string }

    LikeResult:
      type: object
      required: [liked, likeCount]
      properties:
        liked:     { type: boolean }
        likeCount: { type: integer }

    # ── Users ────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, username, followersCount, followingCount, createdAt]
      properties:
        id:             { type: integer }
        username:       { type: string }
        displayName:    { type: ["string", "null"] }
        bio:            { type: ["string", "null"] }
        avatarUrl:      { type: ["string", "null"] }
        favoriteSport:  { type: ["string", "null"] }
        followersCount: { type: integer }
        followingCount: { type: integer }
        isFollowing:    { type: boolean }
        createdAt:      { type: string }

    UserProfileUpdate:
      type: object
      properties:
        displayName:   { type: string }
        bio:           { type: string }
        avatarUrl:     { type: string }
        favoriteSport: { type: string }

    FollowResult:
      type: object
      required: [following]
      properties:
        following: { type: boolean }

    # ── Messages ─────────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [id, participantId, participantUsername, createdAt]
      properties:
        id:                   { type: integer }
        participantId:        { type: integer }
        participantUsername:  { type: string }
        participantAvatarUrl: { type: ["string", "null"] }
        lastMessage:          { type: ["string", "null"] }
        lastMessageAt:        { type: ["string", "null"] }
        unreadCount:          { type: integer }
        createdAt:            { type: string }

    ConversationInput:
      type: object
      required: [participantId]
      properties:
        participantId: { type: integer }

    Message:
      type: object
      required: [id, conversationId, senderId, content, createdAt]
      properties:
        id:             { type: integer }
        conversationId: { type: integer }
        senderId:       { type: integer }
        senderUsername: { type: string }
        content:        { type: string }
        createdAt:      { type: string }

    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }

    # ── Leaderboard ──────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [userId, username, totalBets, wins, winRate, totalProfit, roi, streak, rank]
      properties:
        userId:      { type: integer }
        username:    { type: string }
        avatarUrl:   { type: ["string", "null"] }
        totalBets:   { type: integer }
        wins:        { type: integer }
        winRate:     { type: number }
        totalProfit: { type: number }
        roi:         { type: number }
        streak:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/LeaderboardDay" }
        rank:        { type: integer }

    LeaderboardDay:
      type: object
      required: [date, profit, profitable]
      properties:
        date:       { type: string }
        profit:     { type: number }
        profitable: { type: boolean }
